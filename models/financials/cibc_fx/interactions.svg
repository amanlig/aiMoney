<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 860" role="img" aria-labelledby="uml-title"><title id="uml-title">UML sequence: training, evaluation, and prediction</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334b67"/></marker></defs><rect width="1140" height="860" fill="white"/><rect x="15" y="16" width="160" height="40" rx="5" fill="#eaf1fa" stroke="#334b67"/><text x="95" y="42" text-anchor="middle" font-family="sans-serif" font-size="16">User</text><line x1="95" y1="56" x2="95" y2="830" stroke="#b0bdca" stroke-dasharray="5 5"/><rect x="205" y="16" width="160" height="40" rx="5" fill="#eaf1fa" stroke="#334b67"/><text x="285" y="42" text-anchor="middle" font-family="sans-serif" font-size="16">train.py</text><line x1="285" y1="56" x2="285" y2="830" stroke="#b0bdca" stroke-dasharray="5 5"/><rect x="395" y="16" width="160" height="40" rx="5" fill="#eaf1fa" stroke="#334b67"/><text x="475" y="42" text-anchor="middle" font-family="sans-serif" font-size="16">SQLite samples</text><line x1="475" y1="56" x2="475" y2="830" stroke="#b0bdca" stroke-dasharray="5 5"/><rect x="585" y="16" width="160" height="40" rx="5" fill="#eaf1fa" stroke="#334b67"/><text x="665" y="42" text-anchor="middle" font-family="sans-serif" font-size="16">model.py</text><line x1="665" y1="56" x2="665" y2="830" stroke="#b0bdca" stroke-dasharray="5 5"/><rect x="775" y="16" width="160" height="40" rx="5" fill="#eaf1fa" stroke="#334b67"/><text x="855" y="42" text-anchor="middle" font-family="sans-serif" font-size="16">JSON artifacts</text><line x1="855" y1="56" x2="855" y2="830" stroke="#b0bdca" stroke-dasharray="5 5"/><rect x="965" y="16" width="160" height="40" rx="5" fill="#eaf1fa" stroke="#334b67"/><text x="1045" y="42" text-anchor="middle" font-family="sans-serif" font-size="16">predict.py</text><line x1="1045" y1="56" x2="1045" y2="830" stroke="#b0bdca" stroke-dasharray="5 5"/><line x1="95" y1="100" x2="285" y2="100" stroke="#334b67" marker-end="url(#arrow)"/><text x="190.0" y="91" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Run training</text><line x1="285" y1="143" x2="475" y2="143" stroke="#334b67" marker-end="url(#arrow)"/><text x="380.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Read samples (read-only)</text><line x1="475" y1="186" x2="285" y2="186" stroke="#334b67" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="380.0" y="177" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Transaction rows</text><line x1="285" y1="229" x2="665" y2="229" stroke="#334b67" marker-end="url(#arrow)"/><text x="475.0" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">1. Split dates; fit earlier rows</text><line x1="665" y1="272" x2="285" y2="272" stroke="#334b67" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="475.0" y="263" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Evaluation model</text><line x1="285" y1="315" x2="665" y2="315" stroke="#334b67" marker-end="url(#arrow)"/><text x="475.0" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">2. Score later rows</text><line x1="665" y1="358" x2="285" y2="358" stroke="#334b67" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="475.0" y="349" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Holdout errors</text><line x1="285" y1="401" x2="855" y2="401" stroke="#334b67" marker-end="url(#arrow)"/><text x="570.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Save holdout.json</text><line x1="285" y1="444" x2="665" y2="444" stroke="#334b67" marker-end="url(#arrow)"/><text x="475.0" y="435" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">3. Refit on ALL eligible rows</text><line x1="665" y1="487" x2="285" y2="487" stroke="#334b67" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="475.0" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Final model</text><line x1="285" y1="530" x2="855" y2="530" stroke="#334b67" marker-end="url(#arrow)"/><text x="570.0" y="521" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Save model.json</text><line x1="95" y1="573" x2="1045" y2="573" stroke="#334b67" marker-end="url(#arrow)"/><text x="570.0" y="564" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Run prediction: direction + USD amount + reference rate</text><line x1="1045" y1="616" x2="855" y2="616" stroke="#334b67" marker-end="url(#arrow)"/><text x="950.0" y="607" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Read final model.json</text><line x1="855" y1="659" x2="1045" y2="659" stroke="#334b67" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="950.0" y="650" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Final model</text><line x1="1045" y1="702" x2="665" y2="702" stroke="#334b67" marker-end="url(#arrow)"/><text x="855.0" y="693" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">predict()</text><line x1="665" y1="745" x2="1045" y2="745" stroke="#334b67" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="855.0" y="736" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">Estimated rate and CAD total</text><line x1="1045" y1="788" x2="95" y2="788" stroke="#334b67" marker-end="url(#arrow)"/><text x="570.0" y="779" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17283c">JSON estimate + amount-range warning</text></svg>