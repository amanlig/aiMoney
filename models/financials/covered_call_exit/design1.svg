<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1740" role="img" aria-labelledby="title description"><title id="title">Proposed TFT option pricing architecture</title><desc id="description">Offline quote collection, horizon-specific TFT training and evaluation, then proposed online scenarios, spread estimation and rollover ranking. This architecture is not implemented.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9eb4cd"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eaf0f8}.title{font-size:29px;font-weight:700}.head{font-size:18px;font-weight:650}.body{font-size:15px}.note{font-size:15px;fill:#b3c4d7}.lane{font-size:16px;fill:#98bde6;font-weight:650;letter-spacing:1px}</style><rect width="1600" height="1740" fill="#070b11"/><text x="35" y="44" class="title">design1 · Proposed TFT option pricing architecture</text><text x="35" y="76" class="note">PROPOSAL ONLY · Current simulator stays unchanged until evaluation passes · USD only</text><rect x="35" y="103" width="1530" height="120" rx="12" fill="#132031" stroke="#b48b50" stroke-width="2" /><text x="53" y="132" class="head">Important model fit</text><text x="53" y="160" class="body">Hugging Face TFT-Lite predicts a SPY option mark using 10-day feature sequences and a single-step output.</text><text x="53" y="182" class="body">It does not directly supply ASTS bid/ask quotes or a validated 30-trading-day forecast.</text><text x="53" y="204" class="body">Proposed adaptation: retrain / fine-tune and evaluate a direct 30-day mark target, plus a separate spread model.</text><text x="35" y="263" class="lane">1  OFFLINE DATA AND LEARNING · app owns acquisition; models owns learning</text><rect x="35" y="285" width="470" height="175" rx="12" fill="#132031" stroke="#4279a8" stroke-width="2" stroke-dasharray="8 5"/><text x="53" y="314" class="head">Broker / market-data collectors</text><text x="53" y="342" class="body">Questrade: current chain, bid/ask, Greeks</text><text x="53" y="364" class="body">Test exact-contract historical option OHLCV</text><text x="53" y="386" class="body">Stock history + rate / dividend inputs</text><text x="53" y="408" class="body">Volume / open interest: verify provider coverage</text><rect x="565" y="285" width="470" height="175" rx="12" fill="#132031" stroke="#4279a8" stroke-width="2" stroke-dasharray="8 5"/><text x="583" y="314" class="head">Private historical quote archive</text><text x="583" y="342" class="body">Timestamped stock + option snapshots</text><text x="583" y="364" class="body">Store bid, ask, mark, IV, Greeks, liquidity</text><text x="583" y="386" class="body">Exact contract / expiry / strike / multiplier</text><text x="583" y="408" class="body">Candles alone do not supply quote history</text><rect x="1095" y="285" width="470" height="175" rx="12" fill="#132031" stroke="#8a6db0" stroke-width="2" stroke-dasharray="8 5"/><text x="1113" y="314" class="head">Hugging Face candidate package</text><text x="1113" y="342" class="body">major-year-project/tft-option-pricing</text><text x="1113" y="364" class="body">Weights, config and fitted scalers</text><text x="1113" y="386" class="body">Reconstruct architecture; pin version</text><text x="1113" y="408" class="body">Verify license, feature order and target</text><polyline points="505,370 565,370" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="510" width="750" height="165" rx="12" fill="#132031" stroke="#479b84" stroke-width="2" stroke-dasharray="8 5"/><text x="303" y="539" class="head">Feature / label pipeline · no future-data leakage</text><text x="303" y="567" class="body">Build 10-day sequences by exact contract, matching the verified feature schema.</text><text x="303" y="589" class="body">Inputs: IV, Greeks, time-to-expiry, moneyness, strike, type, volume, open interest.</text><text x="303" y="611" class="body">Proposed label: observed option mark 30 trading days later; no post-expiry labels.</text><text x="303" y="633" class="body">Fit preprocessing on training dates only; split by time and purge overlapping targets.</text><polyline points="800,460 800,510" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="730" width="470" height="160" rx="12" fill="#132031" stroke="#479b84" stroke-width="2" stroke-dasharray="8 5"/><text x="53" y="759" class="head">Adapted TFT mark predictor</text><text x="53" y="787" class="body">PyTorch · feature selection → LSTM</text><text x="53" y="809" class="body">Temporal attention → mark output</text><text x="53" y="831" class="body">Direct 30-day target for held / rolled calls</text><text x="53" y="853" class="body">Single-step package needs adaptation</text><rect x="565" y="730" width="470" height="160" rx="12" fill="#132031" stroke="#479b84" stroke-width="2" stroke-dasharray="8 5"/><text x="583" y="759" class="head">Separate spread estimator</text><text x="583" y="787" class="body">Learn spread from historical bid/ask</text><text x="583" y="809" class="body">Use only information available at forecast</text><text x="583" y="831" class="body">Predict nonnegative future spread</text><text x="583" y="853" class="body">Calibrate uncertainty on held-out dates</text><rect x="1095" y="730" width="470" height="160" rx="12" fill="#132031" stroke="#b48b50" stroke-width="2" stroke-dasharray="8 5"/><text x="1113" y="759" class="head">Evaluation and promotion gate</text><text x="1113" y="787" class="body">Walk-forward test on ASTS / held stocks</text><text x="1113" y="809" class="body">Compare current baseline at same horizon</text><text x="1113" y="831" class="body">Check price errors, coverage and rankings</text><text x="1113" y="853" class="body">Reject leakage or unsupported data domains</text><polyline points="430,675 430,700 270,700 270,730" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,675 800,730" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1330,460 1330,485 1060,485 1060,700 505,700 505,730" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><polyline points="505,810 535,810 535,915 1080,915 1080,810 1095,810" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1035,810 1095,810" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><rect x="1095" y="955" width="470" height="110" rx="12" fill="#132031" stroke="#479b84" stroke-width="2" stroke-dasharray="8 5"/><text x="1113" y="984" class="head">Versioned model bundle</text><text x="1113" y="1012" class="body">Approved TFT + scalers + spread model</text><text x="1113" y="1034" class="body">Feature schema, horizon and validation metrics</text><polyline points="1330,890 1330,955" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="1010" class="lane">2  ONLINE SCENARIOS · proposed local inference, no trading orders</text><rect x="35" y="1040" width="470" height="180" rx="12" fill="#132031" stroke="#4279a8" stroke-width="2" /><text x="53" y="1069" class="head">Investment application</text><text x="53" y="1097" class="body">Current broker snapshot + saved holdings</text><text x="53" y="1119" class="body">Original stock purchase / opening premium</text><text x="53" y="1141" class="body">Read latest per-contract feature histories</text><text x="53" y="1163" class="body">Slider → hypothetical stock scenario</text><text x="53" y="1185" class="body">Close today → fixed captured market quotes</text><rect x="565" y="1110" width="470" height="190" rx="12" fill="#132031" stroke="#479b84" stroke-width="2" stroke-dasharray="8 5"/><text x="583" y="1139" class="head">Independent inference adapter</text><text x="583" y="1167" class="body">models/financials: load approved bundle</text><text x="583" y="1189" class="body">Same feature order / training transforms</text><text x="583" y="1211" class="body">Predict 30-day mark + separate spread</text><text x="583" y="1233" class="body">Scenario stock changes → consistent IV / Greeks</text><text x="583" y="1255" class="body">assumptions</text><text x="583" y="1277" class="body">Missing history / out-of-domain → baseline</text><polyline points="505,1130 535,1130 535,1160 565,1160" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1330,1065 1330,1090 800,1090 800,1110" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><rect x="1095" y="1130" width="470" height="170" rx="12" fill="#132031" stroke="#8a6db0" stroke-width="2" stroke-dasharray="8 5"/><text x="1113" y="1159" class="head">Bid / ask + uncertainty</text><text x="1113" y="1187" class="body">Validate mark-to-mid convention first</text><text x="1113" y="1209" class="body">Estimated bid = midpoint − spread / 2</text><text x="1113" y="1231" class="body">Estimated ask = midpoint + spread / 2</text><text x="1113" y="1253" class="body">Enforce valid ordering and pricing bounds</text><text x="1113" y="1275" class="body">Label forecast ranges and model version</text><polyline points="1035,1200 1095,1200" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="1350" width="750" height="150" rx="12" fill="#132031" stroke="#4279a8" stroke-width="2" /><text x="303" y="1379" class="head">Existing cash-flow and ranking engine</text><text x="303" y="1407" class="body">Current bids / asks for rollover execution today; forecast ask for later buyback.</text><text x="303" y="1429" class="body">Simulate stock sale; subtract call buybacks; add replacement premium.</text><text x="303" y="1451" class="body">Net profit = discounted closing wealth + original premium − original stock cost.</text><text x="303" y="1473" class="body">Keep strike / expiry search windows; rank top 3; label sale-floor failures.</text><polyline points="1330,1300 1330,1325 900,1325 900,1350" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><polyline points="270,1220 270,1325 430,1325 430,1350" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><rect x="1095" y="1370" width="470" height="145" rx="12" fill="#132031" stroke="#4279a8" stroke-width="2" /><text x="1113" y="1399" class="head">Dashboard comparison</text><text x="1113" y="1427" class="body">First group: fixed Close today benchmark</text><text x="1113" y="1449" class="body">Next: top 3 scenario-driven rollovers</text><text x="1113" y="1471" class="body">Show price sources, forecast uncertainty</text><text x="1113" y="1493" class="body">Baseline comparison / fallback stays available</text><polyline points="1035,1425 1095,1425" fill="none" stroke="#9eb4cd" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="1550" width="1530" height="145" rx="12" fill="#132031" stroke="#b48b50" stroke-width="2" /><text x="53" y="1579" class="head">Design decisions and limits</text><text x="53" y="1607" class="body">Dashed boxes: proposed new components. Solid app boxes: existing responsibilities to retain or extend.</text><text x="53" y="1629" class="body">No actual future Greeks, IV or volume may be supplied as known inputs. Slider outputs are conditional scenarios, not market forecasts.</text><text x="53" y="1651" class="body">The research model’s mark definition, time-step alignment and feature availability must be verified before deployment.</text><text x="53" y="1673" class="body">No model download, training, API history fetch or runtime integration has been performed as part of this diagram.</text><text x="35" y="1720" class="note">Source: huggingface.co/major-year-project/tft-option-pricing · Details: design1.md</text></svg>