<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1330" role="img" aria-labelledby="title desc"><title id="title">Covered-call exit model design</title><desc id="desc">Current data acquisition, independent simulation, fixed closing benchmark, slider recalculation, and separate planned research.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#93aac1"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e8eff8}.title{font-size:28px;font-weight:700}.heading{font-size:18px;font-weight:650}.body{font-size:15px}.muted{fill:#b1c1d2;font-size:15px}</style><rect width="1500" height="1330" fill="#080c12"/><text x="35" y="45" class="title">Covered-call exit model · implemented design</text><text x="35" y="76" class="muted">USD only · fees excluded · top 3 rollovers + fixed Close today reference</text><rect x="35" y="110" width="440" height="150" rx="12" fill="#131d29" stroke="#355e83" stroke-width="2" /><text x="53" y="140" class="heading">Local investment records</text><text x="53" y="168" class="body">Holdings JSON: account / shares / short call</text><text x="53" y="191" class="body">SQLite: original USD stock purchase price</text><text x="53" y="214" class="body">Original opening premium: exact contract match</text><rect x="530" y="110" width="435" height="150" rx="12" fill="#131d29" stroke="#355e83" stroke-width="2" /><text x="548" y="140" class="heading">Market data · refresh only</text><text x="548" y="168" class="body">Yahoo: last 3 months of daily stock closes</text><text x="548" y="191" class="body">Questrade: stock / chain / current bid-ask</text><text x="548" y="214" class="body">Verify contract, size, delay and halt status</text><rect x="1020" y="110" width="445" height="150" rx="12" fill="#131d29" stroke="#355e83" stroke-width="2" /><text x="1038" y="140" class="heading">Browser dashboard</text><text x="1038" y="168" class="body">Select holding · Refresh data &amp; analyze</text><text x="1038" y="191" class="body">Record original opening option premium</text><text x="1038" y="214" class="body">Stock-price slider and reset control</text><rect x="245" y="320" width="730" height="125" rx="12" fill="#131d29" stroke="#355e83" stroke-width="2" /><text x="263" y="350" class="heading">coveredCallOptimizer/exit_optimizer.py · application adapter</text><text x="263" y="378" class="body">Owns credentials, data retrieval, original transactions and capture storage</text><text x="263" y="401" class="body">POST /api/exit-optimizer/run → validated model input dictionary</text><polyline points="250,260 250,290 430,290 430,320" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><polyline points="745,260 745,320" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1230,260 1230,290 900,290 900,320" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="490" width="970" height="390" rx="16" fill="#0d1820" stroke="#42a48a" stroke-width="2"/><text x="55" y="522" class="heading">models/financials/covered_call_exit/model.py · independent pure Python</text><rect x="55" y="548" width="440" height="130" rx="12" fill="#131d29" stroke="#42a48a" stroke-width="2" /><text x="73" y="578" class="heading">Stock paths</text><text x="73" y="606" class="body">600 seeded return-bootstrap simulations</text><text x="73" y="629" class="body">Start at captured or hypothetical stock midpoint</text><text x="73" y="652" class="body">30 trading days; historical drift retained</text><rect x="535" y="548" width="450" height="130" rx="12" fill="#131d29" stroke="#42a48a" stroke-width="2" /><text x="553" y="578" class="heading">Option valuation</text><text x="553" y="606" class="body">Calibrate IV per captured option midpoint</text><text x="553" y="629" class="body">European call formula + captured half-spread</text><text x="553" y="652" class="body">Keep IV / spreads fixed; handle expiry</text><rect x="155" y="730" width="730" height="125" rx="12" fill="#131d29" stroke="#42a48a" stroke-width="2" /><text x="173" y="760" class="heading">Cash flows and ranking</text><text x="173" y="788" class="body">Stock sale − call purchases + replacement premium = discounted closing wealth</text><text x="173" y="811" class="body">Net profit = closing wealth + original premium − original stock cost</text><text x="173" y="834" class="body">Top 3 by net profit; show losses and sale-floor failures</text><polyline points="610,445 610,475 285,475 285,548" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><polyline points="610,475 760,475 760,548" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><polyline points="285,678 285,730" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><polyline points="760,678 760,730" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><rect x="1045" y="340" width="420" height="145" rx="12" fill="#131d29" stroke="#355e83" stroke-width="2" /><text x="1063" y="370" class="heading">Private captured JSON</text><text x="1063" y="398" class="body">Original inputs + scenario results</text><text x="1063" y="421" class="body">coveredCallOptimizer/reports/exit-optimizer-*.json</text><text x="1063" y="444" class="body">Refresh writes; slider never overwrites</text><polyline points="975,385 1045,385" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><rect x="1045" y="550" width="420" height="180" rx="12" fill="#131d29" stroke="#ab8acb" stroke-width="2" /><text x="1063" y="580" class="heading">Slider scenario · local POST</text><text x="1063" y="608" class="body">Read original saved capture</text><text x="1063" y="631" class="body">Hypothetical spot: ±50% of current midpoint</text><text x="1063" y="654" class="body">Reprice calls at captured IV and spreads</text><text x="1063" y="677" class="body">Reuse history, seed and 30-day period</text><text x="1063" y="700" class="body">No broker requests / no persistence</text><polyline points="1255,485 1255,550" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1045,645 1018,645 1018,710 760,710 760,730" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><rect x="1045" y="780" width="420" height="100" rx="12" fill="#131d29" stroke="#c4a35c" stroke-width="2" /><text x="1063" y="810" class="heading">Fixed baseline</text><text x="1063" y="838" class="body">Captured stock bid − original held-call ask</text><text x="1063" y="861" class="body">Unaffected by the stock-price slider</text><polyline points="1465,415 1480,415 1480,830 1465,830" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="935" width="1060" height="145" rx="12" fill="#131d29" stroke="#518acb" stroke-width="2" /><text x="263" y="965" class="heading">Interactive chart · browser</text><text x="263" y="993" class="body">First group: Close today (fixed) · next groups: top 3 rollovers (scenario-sensitive)</text><text x="263" y="1016" class="body">Green = stock sale · red = buybacks · blue = replacement sale premium · purple = net profit</text><text x="263" y="1039" class="body">Original stock purchase: solid line · opening premium: dashed line · all amounts USD</text><polyline points="520,880 520,935" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1255,880 1255,935" fill="none" stroke="#93aac1" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="1135" width="1430" height="145" rx="12" fill="#131d29" stroke="#8c779e" stroke-width="2" stroke-dasharray="8 5"/><text x="53" y="1165" class="heading">Planned research · NOT implemented</text><text x="53" y="1193" class="body">Test Questrade exact-contract option candles (OHLCV) → potential historical evaluation</text><text x="53" y="1216" class="body">Historical bid/ask / Greeks collection and Hugging Face pricing-model comparisons remain future work</text><text x="53" y="1239" class="body">No historical option backtest or learned bid/ask forecast is currently used; no order execution</text><text x="35" y="1310" class="muted">Details and interaction sequence: DESIGN.md · Generator: draw_design.py</text></svg>