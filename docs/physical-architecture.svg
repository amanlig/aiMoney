<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2820" role="img" aria-labelledby="title description"><title id="title">Investment application architecture</title><desc id="description">High-level context: trader uses the Covered Call Optimizer system, which reads Questrade and Yahoo data and requests OpenAI assessments. Application architecture: React.js dashboard calls FastAPI in dashboard_server.py, which calls exit_optimizer.py and the independent model.py. Settings, persistence, Questrade, Yahoo and OpenAI assessment services stay in the application. React.js and FastAPI are implemented; Docker packages the API and React build.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#99b1cb"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e8eff8}.title{font-size:29px;font-weight:700}.heading{font-size:18px;font-weight:650}.body{font-size:15px}.note{font-size:14px;fill:#b4c7da}</style><rect width="1600" height="2820" fill="#080c12"/><text x="35" y="45" class="title">Covered Call Optimizer · system context</text><text x="35" y="76" class="note">High-level view · actor, system under development and external resources · No order execution</text><rect x="35" y="270" width="300" height="170" rx="12" fill="#142131" stroke="#d3ab64" stroke-width="2" /><text x="53" y="300" class="heading">Actor · Trader</text><text x="53" y="328" class="body">Provides purchase / premium</text><text x="53" y="350" class="body">records and objectives</text><text x="53" y="372" class="body">Explores scenarios and decides</text><text x="53" y="394" class="body">whether to trade</text><rect x="450" y="230" width="460" height="230" rx="12" fill="#142131" stroke="#49a58a" stroke-width="2" /><text x="468" y="260" class="heading">System · Covered Call Optimizer</text><text x="468" y="288" class="body">The system we are developing</text><text x="468" y="310" class="body">React.js UI, API, model, settings and local storage</text><text x="468" y="332" class="body">Compares closing / rolling covered calls; shows cash,</text><text x="468" y="354" class="body">profit and liquidity</text><text x="468" y="376" class="body">Provides requested assessments; trader keeps execution</text><text x="468" y="398" class="body">control</text><rect x="1110" y="140" width="450" height="140" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="1128" y="170" class="heading">External · Questrade API</text><text x="1128" y="198" class="body">Stock / option quotes, displayed sizes, Greeks,</text><text x="1128" y="220" class="body">listed calls and positions</text><text x="1128" y="242" class="body">Read-only broker access; no order submission</text><rect x="1110" y="340" width="450" height="140" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="1128" y="370" class="heading">External · Yahoo Finance</text><text x="1128" y="398" class="body">Three months of daily stock closes</text><text x="1128" y="420" class="body">Historical input to scenario simulations</text><rect x="1110" y="540" width="450" height="140" rx="12" fill="#142131" stroke="#8b73af" stroke-width="2" /><text x="1128" y="570" class="heading">External · OpenAI API</text><text x="1128" y="598" class="body">Receives selected position / scenario snapshot</text><text x="1128" y="620" class="body">Returns an assessment on explicit request</text><polyline points="335,330 450,330" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="310" class="note">Inputs</text><polyline points="450,390 335,390" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="420" class="note">Results</text><polyline points="1110,210 1000,210 1000,270 910,270" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="925" y="190" class="note">Quotes / chains</text><polyline points="1110,410 910,410" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="940" y="390" class="note">Stock history</text><polyline points="910,440 980,440 980,605 1110,605" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="1005" y="585" class="note">Snapshot</text><polyline points="1110,645 945,645 945,480 800,480 800,460" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="980" y="666" class="note">Assessment</text><text x="35" y="550" class="note">Inside our system: React.js browser UI, application API / services, independent pricing model, SQLite and saved captures.</text><text x="35" y="580" class="note">Outside our system: the trader and external market-data / AI services. Brokerage trade execution remains outside this tool.</text><line x1="35" y1="715" x2="1565" y2="715" stroke="#43627e" stroke-width="2"/><g transform="translate(0 740)"><text x="35" y="45" class="title">Covered-call optimizer · running deployment</text><text x="35" y="76" class="note">October 21, 2026 · Docker Desktop / WSL 2 · React → FastAPI → application services → model</text><rect x="420" y="115" width="760" height="150" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="438" y="145" class="heading">Browser · React.js · frontend/</text><text x="438" y="173" class="body">Home / covered-call-optimizer, chart, slider and Close / Expire controls</text><text x="438" y="195" class="body">Profile / Settings, opening premiums and Recommendation panel</text><text x="438" y="217" class="body">Same-origin /api/ requests; credentials remain on the server</text><rect x="350" y="340" width="900" height="1160" rx="16" fill="#0c1623" stroke="#49a58a" stroke-width="2" stroke-dasharray="10 6"/><text x="375" y="373" class="heading">Docker Compose · api service · aimoney-api image</text><text x="375" y="398" class="note">Non-root runtime · one Uvicorn worker · host 127.0.0.1:8765 → container :8765</text><rect x="420" y="440" width="760" height="170" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="438" y="470" class="heading">FastAPI · dashboard_server.py</text><text x="438" y="498" class="body">Serves the React build and typed /api/ routes; OpenAPI at /docs</text><text x="438" y="520" class="body">Holdings / saved capture / scenario / refresh / settings / assessments</text><text x="438" y="542" class="body">Origin checks, body limits, JSON errors and shared operation locks</text><text x="438" y="564" class="body">Lifespan starts / stops Yahoo reference feed; /api/health health check</text><polyline points="700,265 700,300 330,300 330,475 420,475" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="370" y="290" class="note">HTTP / JSON request</text><polyline points="1180,485 1270,485 1270,300 900,300 900,265" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="930" y="290" class="note">React assets / JSON response</text><rect x="25" y="725" width="300" height="210" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="43" y="755" class="heading">External · market data</text><text x="43" y="783" class="body">Questrade: stock / option quotes,</text><text x="43" y="805" class="body">Greeks, chains and positions</text><text x="43" y="827" class="body">Yahoo: stock history; separate</text><text x="43" y="849" class="body">periodic FX reference</text><text x="43" y="871" class="body">Broker requests only on explicit</text><text x="43" y="893" class="body">optimizer refresh</text><rect x="420" y="720" width="760" height="170" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="438" y="750" class="heading">Application adapter · exit_optimizer.py</text><text x="438" y="778" class="body">Refresh: acquire market data, read transactions and build inputs</text><text x="438" y="800" class="body">Scenario: reprice saved capture locally, without market requests</text><text x="438" y="822" class="body">Evaluate the independent model; persist captures only on refresh</text><polyline points="700,610 700,720" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="505" y="665" class="note">Refresh / scenario</text><polyline points="900,720 900,610" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="665" class="note">Analysis result</text><polyline points="325,790 420,790" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="770" class="note">Quotes</text><polyline points="420,845 325,845" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="875" class="note">Requests</text><rect x="420" y="985" width="760" height="195" rx="12" fill="#142131" stroke="#49a58a" stroke-width="2" /><text x="438" y="1015" class="heading">Independent pricing model · model.py</text><text x="438" y="1043" class="body">models/financials/covered_call_exit/model.py</text><text x="438" y="1065" class="body">IV calibration, European call approximation and 600 return paths</text><text x="438" y="1087" class="body">30-trading-day baseline; cash flows, profit, top 3 rolls and funding</text><text x="438" y="1109" class="body">Fixed captured Close today reference; hypothetical stock scenarios</text><text x="438" y="1131" class="body">Pure calculations: no HTTP, database, credentials or OpenAI</text><polyline points="700,890 700,985" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="490" y="940" class="note">Validated model inputs</text><polyline points="900,985 900,890" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="940" class="note">Calculated outputs</text><rect x="420" y="1270" width="350" height="200" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="438" y="1300" class="heading">Settings services</text><text x="438" y="1328" class="body">stock_basis.py</text><text x="438" y="1350" class="body">option_premiums.py / fx_samples.py</text><text x="438" y="1372" class="body">Validate reviewed entries; save original</text><text x="438" y="1394" class="body">costs and premiums to SQLite</text><rect x="820" y="1270" width="360" height="200" rx="12" fill="#142131" stroke="#8b73af" stroke-width="2" /><text x="838" y="1300" class="heading">Recommendation services</text><text x="838" y="1328" class="body">optimizer_recommendations.py</text><text x="838" y="1350" class="body">Rebuild verified chart snapshot</text><text x="838" y="1372" class="body">optimizer_assessments.py</text><text x="838" y="1394" class="body">Call OpenAI; save assessment history</text><rect x="1280" y="1270" width="295" height="200" rx="12" fill="#142131" stroke="#8b73af" stroke-width="2" /><text x="1298" y="1300" class="heading">External · OpenAI API</text><text x="1298" y="1328" class="body">Responses API</text><text x="1298" y="1350" class="body">Explicit Generate action only</text><text x="1298" y="1372" class="body">Receives selected facts; returns</text><text x="1298" y="1394" class="body">an assessment</text><text x="1298" y="1416" class="body">No trade submission</text><polyline points="1000,1270 1000,1180" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="1010" y="1225" class="note">Rebuild snapshot</text><polyline points="420,525 380,525 380,1370 420,1370" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1180,525 1220,525 1220,1370 1180,1370" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1180,1325 1280,1325" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="1188" y="1305" class="note">Snapshot</text><polyline points="1280,1420 1180,1420" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="1188" y="1450" class="note">Assessment</text><rect x="25" y="1615" width="1550" height="315" rx="16" fill="#0c1623" stroke="#d3ab64" stroke-width="2"/><text x="50" y="1650" class="heading">WSL host storage · bind mounts · persists across container replacement</text><rect x="55" y="1680" width="465" height="175" rx="12" fill="#142131" stroke="#d3ab64" stroke-width="2" /><text x="73" y="1710" class="heading">data/ → /app/data · read / write</text><text x="73" y="1738" class="body">fx-samples.sqlite3: shared stock basis, opening</text><text x="73" y="1760" class="body">premiums, FX samples and recommendation_runs</text><text x="73" y="1782" class="body">Private saved account holdings JSON</text><rect x="565" y="1680" width="465" height="175" rx="12" fill="#142131" stroke="#d3ab64" stroke-width="2" /><text x="583" y="1710" class="heading">reports/ → /app/reports · read / write</text><text x="583" y="1738" class="body">Per-holding quote / model captures and generated</text><text x="583" y="1760" class="body">reports</text><text x="583" y="1782" class="body">GET /api/exit-optimizer/capture loads saved chart data;</text><text x="583" y="1804" class="body">slider never saves</text><rect x="1075" y="1680" width="465" height="175" rx="12" fill="#142131" stroke="#d3ab64" stroke-width="2" /><text x="1093" y="1710" class="heading">.secrets/ → /app/.secrets · read / write</text><text x="1093" y="1738" class="body">OpenAI configuration and Questrade authorization</text><text x="1093" y="1760" class="body">Writable because broker refresh tokens rotate; never</text><text x="1093" y="1782" class="body">sent to browser</text><text x="55" y="1895" class="note">Optional CIBC FX artifacts mount read-only; its separate training / publishing workflow is outside this view.</text><polyline points="590,1470 590,1540 290,1540 290,1680" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1000,1470 1000,1575 380,1575 380,1680" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1180,875 1235,875 1235,1555 800,1555 800,1680" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1540,1780 1585,1780 1585,650 1205,650 1205,570 1180,570" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="1280" y="630" class="note">Server credentials</text><text x="35" y="1980" class="note">Image build: Python dependencies + application / model code + local React assets. Private runtime files stay outside the image.</text><text x="35" y="2010" class="note">Docker health verified · host loopback only · rprivate bind propagation · one worker preserves refresh / token locks.</text><text x="35" y="2040" class="note">Sources: ARCHITECTURE.md / compose.yaml / Dockerfile · Regenerate: python architecture_diagram.py</text></g></svg>