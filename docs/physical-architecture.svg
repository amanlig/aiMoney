<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2270" role="img" aria-labelledby="title description"><title id="title">Investment application architecture</title><desc id="description">High-level context: trader uses the Covered Call Optimizer system, which reads Questrade and Yahoo data and requests OpenAI assessments. Detailed proposed architecture: dashboard calls FastAPI in dashboard_server.py, which calls exit_optimizer.py and the independent model.py. Settings, persistence, Questrade, Yahoo and OpenAI assessment services stay in the application. FastAPI migration is not implemented.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#99b1cb"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e8eff8}.title{font-size:29px;font-weight:700}.heading{font-size:18px;font-weight:650}.body{font-size:15px}.note{font-size:14px;fill:#b4c7da}</style><rect width="1600" height="2270" fill="#080c12"/><text x="35" y="45" class="title">Covered Call Optimizer · system context</text><text x="35" y="76" class="note">High-level view · actor, system under development and external resources · No order execution</text><rect x="35" y="270" width="300" height="170" rx="12" fill="#142131" stroke="#d3ab64" stroke-width="2" /><text x="53" y="300" class="heading">Actor · Trader</text><text x="53" y="328" class="body">Provides purchase / premium</text><text x="53" y="350" class="body">records and objectives</text><text x="53" y="372" class="body">Explores scenarios and decides</text><text x="53" y="394" class="body">whether to trade</text><rect x="450" y="230" width="460" height="230" rx="12" fill="#142131" stroke="#49a58a" stroke-width="2" /><text x="468" y="260" class="heading">System · Covered Call Optimizer</text><text x="468" y="288" class="body">The system we are developing</text><text x="468" y="310" class="body">Dashboard, API, model, settings and local storage</text><text x="468" y="332" class="body">Compares closing / rolling covered calls; shows cash,</text><text x="468" y="354" class="body">profit and liquidity</text><text x="468" y="376" class="body">Provides requested assessments; trader keeps execution</text><text x="468" y="398" class="body">control</text><rect x="1110" y="140" width="450" height="140" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="1128" y="170" class="heading">External · Questrade API</text><text x="1128" y="198" class="body">Stock / option quotes, displayed sizes, Greeks,</text><text x="1128" y="220" class="body">listed calls and positions</text><text x="1128" y="242" class="body">Read-only broker access; no order submission</text><rect x="1110" y="340" width="450" height="140" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="1128" y="370" class="heading">External · Yahoo Finance</text><text x="1128" y="398" class="body">Three months of daily stock closes</text><text x="1128" y="420" class="body">Historical input to scenario simulations</text><rect x="1110" y="540" width="450" height="140" rx="12" fill="#142131" stroke="#8b73af" stroke-width="2" /><text x="1128" y="570" class="heading">External · OpenAI API</text><text x="1128" y="598" class="body">Receives selected position / scenario snapshot</text><text x="1128" y="620" class="body">Returns an assessment on explicit request</text><polyline points="335,330 450,330" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="310" class="note">Inputs</text><polyline points="450,390 335,390" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="420" class="note">Results</text><polyline points="1110,210 1000,210 1000,270 910,270" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="925" y="190" class="note">Quotes / chains</text><polyline points="1110,410 910,410" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="940" y="390" class="note">Stock history</text><polyline points="910,440 980,440 980,605 1110,605" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="1005" y="585" class="note">Snapshot</text><polyline points="1110,645 945,645 945,480 800,480 800,460" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="980" y="666" class="note">Assessment</text><text x="35" y="550" class="note">Inside our system: browser UI, application API / services, independent pricing model, SQLite and saved captures.</text><text x="35" y="580" class="note">Outside our system: the trader and external market-data / AI services. Brokerage trade execution remains outside this tool.</text><line x1="35" y1="715" x2="1565" y2="715" stroke="#43627e" stroke-width="2"/><g transform="translate(0 740)"><text x="35" y="45" class="title">Covered-call optimizer · proposed FastAPI architecture</text><text x="35" y="76" class="note">Design proposal · October 20, 2026 · Framework migration not implemented · USD only · No order execution</text><rect x="420" y="110" width="760" height="150" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="438" y="140" class="heading">1 · Dashboard / browser</text><text x="438" y="168" class="body">covered-call-optimizer.html · chart, slider, Close / Expire choices</text><text x="438" y="190" class="body">Profile / Settings · Recommendation panel · captured quote liquidity</text><text x="438" y="212" class="body">HTTP requests and JSON responses; no credentials or direct model access</text><rect x="420" y="340" width="760" height="170" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="438" y="370" class="heading">2 · FastAPI boundary · dashboard_server.py · :8765</text><text x="438" y="398" class="body">PROPOSED: replace the current built-in HTTP server with FastAPI</text><text x="438" y="420" class="body">Serve dashboard/assets; validate requests, origins and typed inputs</text><text x="438" y="442" class="body">Route holdings, refresh, scenarios, settings and recommendations</text><text x="438" y="464" class="body">Return JSON results / errors; coordinate concurrent work</text><polyline points="700,260 700,340" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="300" class="note">HTTP request</text><polyline points="900,340 900,260" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="300" class="note">JSON response</text><rect x="35" y="600" width="430" height="195" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="53" y="630" class="heading">External market data</text><text x="53" y="658" class="body">Questrade: verified calls, stock quotes, bid/ask</text><text x="53" y="680" class="body">sizes and Greeks</text><text x="53" y="702" class="body">Yahoo: three months of stock closes</text><text x="53" y="724" class="body">Explicit refresh only for optimizer</text><text x="53" y="746" class="body">Broker tokens remain server-side</text><rect x="535" y="600" width="530" height="195" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="553" y="630" class="heading">3 · Application adapter · exit_optimizer.py</text><text x="553" y="658" class="body">Refresh: acquire data, read original transactions, build model</text><text x="553" y="680" class="body">inputs</text><text x="553" y="702" class="body">Scenario: read capture and reprice locally; no market requests</text><text x="553" y="724" class="body">Call independent model; save refresh capture and return result</text><rect x="1135" y="600" width="430" height="195" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="1153" y="630" class="heading">Local persistence</text><text x="1153" y="658" class="body">SQLite: stock basis, opening premiums,</text><text x="1153" y="680" class="body">recommendation_runs</text><text x="1153" y="702" class="body">Private JSON: saved holdings and per-holding quote</text><text x="1153" y="724" class="body">/ model captures</text><text x="1153" y="746" class="body">Slider never overwrites saved capture</text><polyline points="720,510 720,600" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="735" y="555" class="note">Analyze / scenario</text><polyline points="880,600 880,510" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="895" y="555" class="note">Model result</text><polyline points="465,675 535,675" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="535,720 465,720" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1135,675 1065,675" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1065,720 1135,720" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="890" width="760" height="195" rx="12" fill="#142131" stroke="#49a58a" stroke-width="2" /><text x="438" y="920" class="heading">4 · Independent model · model.py</text><text x="438" y="948" class="body">models/financials/covered_call_exit/model.py</text><text x="438" y="970" class="body">IV calibration, European call approximation, 600 return paths</text><text x="438" y="992" class="body">30 trading days; cash flows, profit, top 3 rolls and funding</text><text x="438" y="1014" class="body">Returns data only; no HTTP, database, credentials or OpenAI</text><text x="438" y="1036" class="body">Close today: captured stock bid / held-call ask; fixed reference</text><polyline points="720,795 720,890" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="570" y="844" class="note">Validated inputs</text><polyline points="880,890 880,795" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="895" y="844" class="note">Calculated outputs</text><rect x="35" y="1180" width="470" height="210" rx="12" fill="#142131" stroke="#8b73af" stroke-width="2" /><text x="53" y="1210" class="heading">Recommendation application service</text><text x="53" y="1238" class="body">optimizer_recommendations.py</text><text x="53" y="1260" class="body">Verify capture; rebuild selected chart snapshot using</text><text x="53" y="1282" class="body">adapter / model</text><text x="53" y="1304" class="body">optimizer_assessments.py sends snapshot and saves</text><text x="53" y="1326" class="body">assessment</text><text x="53" y="1348" class="body">Separate from pricing and ranking</text><rect x="565" y="1180" width="470" height="210" rx="12" fill="#142131" stroke="#8b73af" stroke-width="2" /><text x="583" y="1210" class="heading">OpenAI Responses API</text><text x="583" y="1238" class="body">Explicit Generate recommendation action only</text><text x="583" y="1260" class="body">Assess supplied facts, objectives, liquidity and funding</text><text x="583" y="1282" class="body">assumptions</text><text x="583" y="1304" class="body">No live news; no model price calculations; API key stays</text><text x="583" y="1326" class="body">in app</text><rect x="1095" y="1180" width="470" height="210" rx="12" fill="#142131" stroke="#497fae" stroke-width="2" /><text x="1113" y="1210" class="heading">Profile / Settings services</text><text x="1113" y="1238" class="body">stock_basis.py / option_premiums.py</text><text x="1113" y="1260" class="body">FastAPI routes validate reviewed entries and persist to</text><text x="1113" y="1282" class="body">SQLite</text><text x="1113" y="1304" class="body">The model receives recorded costs and premiums as input</text><text x="1113" y="1326" class="body">data</text><polyline points="420,425 15,425 15,1120 270,1120 270,1180" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="505,1280 565,1280" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="510" y="1150" class="note">Snapshot / assessment</text><polyline points="1035,1320 1050,1320 1050,1115 270,1115 270,1180" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1180,425 1585,425 1585,1120 1330,1120 1330,1180" fill="none" stroke="#99b1cb" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="1440" class="note">Recommendation service also reads saved captures, calls the same independent model and writes SQLite assessment history.</text><text x="35" y="1467" class="note">Current runtime still uses SimpleHTTPRequestHandler. Existing :8766 worksheet is separate; TFT remains deferred. FX model excluded.</text><text x="35" y="1495" class="note">Design source: coveredCallOptimizer/ARCHITECTURE.md · Regenerate: python3 coveredCallOptimizer/architecture_diagram.py</text></g></svg>