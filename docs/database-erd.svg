<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 820" role="img" aria-labelledby="title desc"><title id="title">SQLite entity relationship diagram</title><desc id="desc">Four independent tables: FX samples, stock cost basis, opening option premiums and recommendation runs. No foreign keys are defined. Recommendation snapshots embed copies of source records as JSON.</desc><style>text{font-family:Arial,sans-serif;fill:#193149}.h{font-size:22px;font-weight:bold}.f{font-family:monospace;font-size:15px}.n{font-size:16px;fill:#52697f}</style><rect width="2000" height="820" fill="#f3f6fa"/><text x="35" y="42" class="h">Investment SQLite · actual schema</text><text x="35" y="74" class="n">fx-samples.sqlite3 · PK = primary key · UK = unique key · nullable fields marked ?</text><rect x="30" y="105" width="470" height="532" rx="10" fill="white" stroke="#b4c7da"/><path d="M30 158H500" stroke="#b4c7da"/><text x="48" y="140" class="h">samples</text><text x="48" y="187" class="f">id  INTEGER  PK</text><text x="48" y="213" class="f">created_at  TEXT</text><text x="48" y="239" class="f">account  TEXT</text><text x="48" y="265" class="f">symbol  TEXT</text><text x="48" y="291" class="f">instrument  TEXT</text><text x="48" y="317" class="f">action  TEXT</text><text x="48" y="343" class="f">direction  TEXT</text><text x="48" y="369" class="f">trade_date ?  TEXT</text><text x="48" y="395" class="f">settlement_date  TEXT</text><text x="48" y="421" class="f">usd_amount  REAL</text><text x="48" y="447" class="f">commission_usd ?  REAL</text><text x="48" y="473" class="f">cad_amount  REAL</text><text x="48" y="499" class="f">applied_rate  REAL</text><text x="48" y="525" class="f">yahoo_close ?  REAL</text><text x="48" y="551" class="f">yahoo_status  TEXT</text><text x="48" y="577" class="f">notes  TEXT</text><text x="48" y="603" class="f">fingerprint  TEXT  UK</text><text x="48" y="620" class="n">Unique: fingerprint</text><rect x="530" y="105" width="470" height="376" rx="10" fill="white" stroke="#b4c7da"/><path d="M530 158H1000" stroke="#b4c7da"/><text x="548" y="140" class="h">stock_cost_basis</text><text x="548" y="187" class="f">id  INTEGER  PK</text><text x="548" y="213" class="f">account  TEXT</text><text x="548" y="239" class="f">symbol  TEXT</text><text x="548" y="265" class="f">currency  TEXT</text><text x="548" y="291" class="f">purchase_date ?  TEXT</text><text x="548" y="317" class="f">quantity  REAL</text><text x="548" y="343" class="f">price_usd ?  REAL</text><text x="548" y="369" class="f">fees_usd ?  REAL</text><text x="548" y="395" class="f">purchase_fx ?  REAL</text><text x="548" y="421" class="f">total_cost  REAL</text><text x="548" y="447" class="f">updated_at  TEXT</text><text x="548" y="464" class="n">Unique: account, symbol, currency</text><rect x="1030" y="105" width="470" height="428" rx="10" fill="white" stroke="#b4c7da"/><path d="M1030 158H1500" stroke="#b4c7da"/><text x="1048" y="140" class="h">option_premiums</text><text x="1048" y="187" class="f">id  INTEGER  PK</text><text x="1048" y="213" class="f">account  TEXT</text><text x="1048" y="239" class="f">symbol  TEXT</text><text x="1048" y="265" class="f">expiry  TEXT</text><text x="1048" y="291" class="f">strike  REAL</text><text x="1048" y="317" class="f">contracts  INTEGER</text><text x="1048" y="343" class="f">settlement_date  TEXT</text><text x="1048" y="369" class="f">price_usd  REAL</text><text x="1048" y="395" class="f">fees_usd  REAL</text><text x="1048" y="421" class="f">fx  REAL</text><text x="1048" y="447" class="f">net_cad  REAL</text><text x="1048" y="473" class="f">net_usd  REAL</text><text x="1048" y="499" class="f">created_at  TEXT</text><text x="1048" y="516" class="n">Composite unique key; see documentation</text><rect x="1530" y="105" width="470" height="298" rx="10" fill="white" stroke="#b4c7da"/><path d="M1530 158H2000" stroke="#b4c7da"/><text x="1548" y="140" class="h">recommendation_runs</text><text x="1548" y="187" class="f">id  INTEGER  PK</text><text x="1548" y="213" class="f">created_at  TEXT</text><text x="1548" y="239" class="f">model  TEXT</text><text x="1548" y="265" class="f">prompt_version  TEXT</text><text x="1548" y="291" class="f">snapshot_json  TEXT</text><text x="1548" y="317" class="f">assessment  TEXT</text><text x="1548" y="343" class="f">response_id ?  TEXT</text><text x="1548" y="369" class="f">usage_json  TEXT</text><text x="1548" y="386" class="n">snapshot_json and usage_json are TEXT</text><text x="35" y="700" class="h">Relationships</text><text x="35" y="733" class="n">No foreign keys are defined; the tables are intentionally shown without relationship lines.</text><text x="35" y="762" class="n">Recommendations copy source records and calculated results into snapshot_json; these are not enforced relational links.</text><text x="35" y="791" class="n">Stock basis is authoritative in stock_cost_basis; average cost = total_cost / quantity.</text></svg>