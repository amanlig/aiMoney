# Standalone cloud stack; local compose.yaml remains independent.
# Run with: docker compose --env-file .env.aws -f compose.aws.yaml ...
services:
  api:
    image: ${APP_IMAGE:-aimoney:latest}
    build: .
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aimoney:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.aws}@db:5432/aimoney
      APP_ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN to the full hostname}
      APP_AUTH_ENABLED: "1"
      AUTH_TRUST_PROXY: "1"
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?Set AUTH_EMAIL_FROM to a verified SES sender}
      AWS_REGION: us-west-2
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./.secrets:/app/.secrets
      - ./models/financials/cibc_fx/artifacts:/app/models/financials/cibc_fx/artifacts:ro
    restart: unless-stopped
    stop_grace_period: 40s
    logging: &logging
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: aimoney
      POSTGRES_USER: aimoney
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.aws}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aimoney -d aimoney]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging

  caddy:
    image: caddy:2
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the full hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
